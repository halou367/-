<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'"><title>扩展管理</title><link rel="stylesheet" href="extensions.css"></head>
<body><main><header><h1>扩展</h1><div><button id="unpacked">加载未打包的扩展</button><button id="packed">安装 ZIP / CRX</button></div></header><p>扩展在此客户端所有账号的浏览器模式中共享；安装、启停和移除会同步。启用后刷新网页。网站登录保持各账号独立；同一扩展的 chrome.storage.local（含设置、账号表、队列）在所有账号间共享。</p><p>支持 Electron 的 Chrome 扩展 API；部分扩展、商店一键安装和浏览器专属 API 暂不支持。扩展弹窗与选项在当前账号窗口中打开。</p><p>首次迁移采用第一个含数据账号的内容，其他账号原数据保留备份；同时修改同一个存储键时，以最后收到的修改为准。扩展数据继续明文保存在本机。</p><p id="status" role="status"></p><section id="entries" aria-label="已安装扩展"></section></main><script src="extensions.js"></script></body></html>
