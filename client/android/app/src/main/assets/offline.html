<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>切换节点 / ProxyIP</title>
<link rel="stylesheet" href="app.css">
<style>
@font-face{font-family:"Twemoji Country Flags";unicode-range:U+1F1E6-1F1FF,U+1F3F4,U+E0062-E007F;src:url(flags.woff2) format("woff2");font-display:swap}
:root{--bg:#faf9f7;--bg2:#f3f1ec;--bg3:#eae7e0;--card:#ffffff;--fg:#1f1e1c;--fg2:#5f5c56;--fg3:#94918a;--bd:#e6e4de;--bd2:#dcd9d0;--acc:#262522;--accfg:#fff;--bad:#e5484d;--warn:#d97706;--ok:#12a150;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--bg2:#22211f;--bg3:#2b2a27;--card:#1c1b19;--fg:#ecebe8;--fg2:#b5b2aa;--fg3:#85827b;--bd:#2e2d29;--bd2:#383631;--acc:#ecebe8;--accfg:#181816;color-scheme:dark}}
*{box-sizing:border-box}
.dragbar{position:fixed;top:0;left:0;right:150px;height:36px;-webkit-app-region:drag;z-index:9}
html,body{overflow:auto;height:100%;min-height:100%}
body{margin:0;background:radial-gradient(circle at 50% 35%,rgba(0,0,0,.38),rgba(0,0,0,.62)),var(--bg);color:var(--fg);font:13px/1.5 "Twemoji Country Flags",ui-sans-serif,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:36px 16px 28px}
.wrap{width:min(520px,100%);position:relative;z-index:2}
.off-panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 22px 60px rgba(0,0,0,.42);overflow:visible;position:relative}
.off-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px 13px;border-bottom:1px solid var(--bd)}
.off-hl{min-width:0;flex:1}
.off-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.off-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent);flex:none}
.off-dot.ok{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.off-dot.bad{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent)}
h1{font-size:15.5px;font-weight:650;margin:0;line-height:1.3;color:var(--fg)}
.acct-pill{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;background:var(--bg2);color:var(--fg2);font-weight:600;font-size:11px;border:1px solid var(--bd)}
.off-sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px;font-size:11.5px;color:var(--fg3)}
.err{color:var(--fg3);font:11px ui-monospace,Consolas,monospace;word-break:break-all}
.off-hr{display:flex;align-items:center;gap:6px;flex:none}
.off-body{padding:14px 18px 16px}
.off-auto-card{display:none;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;border-radius:11px;background:var(--bg2);border:1px solid var(--bd);margin-top:2px}
.np-auto-mode .off-auto-card{display:flex}
.off-auto-info{min-width:0;flex:1}
.off-auto-info b{display:block;font-size:12.5px;font-weight:600;color:var(--fg)}
.off-auto-info small{display:block;font-size:11.5px;color:var(--fg2);margin-top:2px}
.off-status-bar{padding:8px 18px;background:var(--bg2);border-bottom:1px solid var(--bd);font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.off-status-bar[hidden]{display:none}
.off-foot-extra{padding:10px 18px 13px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.accts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.accts button{font-size:11.5px;padding:3px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--bd2)}
.accts button:hover{border-color:var(--fg3)}
label{display:block;font-size:12px;color:var(--fg2);margin:0 0 6px}
input:not([type="checkbox"]){width:100%;border:1px solid var(--bd2);border-radius:10px;padding:8px 11px;font:inherit;color:inherit;background:var(--bg2);outline:0}
input:focus{border-color:var(--fg3)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;cursor:pointer;border-radius:9px;padding:6px 11px;border:1px solid var(--bd2);background:var(--bg2);color:var(--fg);font-size:12px;transition:border-color .15s,background .15s}
.np-cur,.rsel-btn,.pip-cur,button,input,select{font-family:"Twemoji Country Flags",ui-sans-serif,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#connection-editor .pconn:not([data-busy="true"]) .route-selection-status:not(.bad){display:none}
button:hover:not(:disabled){border-color:var(--fg3)}
button:disabled{opacity:.55;cursor:default}
button.pri,.np-wrap .np-foot .t-ok{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button.ghost{background:transparent}
.hint{font-size:12px;color:var(--fg2);min-height:18px}
.hint.ok{color:var(--ok);font-weight:600}.hint.bad{color:var(--bad)}
small#why{display:none}
@media (max-width:520px){
  body{padding:16px 10px}
  .off-head,.off-status-bar,.off-body,.off-foot-extra{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>
<div class="dragbar"></div>
<div class="wrap">
  <div class="off-panel" id="connection-card">
    <div class="off-head">
      <div class="off-hl">
        <div class="off-title-row">
          <span class="off-dot bad" id="status-dot"></span>
          <h1>切换节点 / ProxyIP</h1>
          <span class="acct-pill" id="acct-badge" hidden></span>
        </div>
        <div class="off-sub">
          <span class="acct-pill" style="background:rgba(229,72,77,.15);color:#ff6b6f;border-color:rgba(229,72,77,.35)">无法连接 · 请切换节点（点右上角 × 可直接离线查阅）</span>
          <span class="err" id="err"></span>
        </div>
      </div>
      <div class="off-hr">
        <button type="button" class="ghost" id="act-browse-top" title="关闭弹窗，直接进入离线查阅模式" aria-label="关闭并离线查阅" style="width:32px;height:32px;padding:0;display:grid;place-items:center;font-size:15px">✕</button>
      </div>
    </div>

    <div class="off-status-bar" id="auto-bar">
      <span class="hint" id="hint">正在自动优选可用节点与全网纯净 IP（节点不通时自动检测本地 7890 代理）…</span>
    </div>

    <div class="off-body">
      <div id="connection-editor" hidden></div>
      <div id="legacy-editor">
        <div id="route-modes" hidden>
          <div class="row" role="group" aria-label="连接模式">
            <button data-route-mode="auto">自动</button>
            <button data-route-mode="node">节点</button>
            <button data-route-mode="proxy">代理</button>
            <button data-route-mode="direct">直连</button>
          </div>
          <p class="hint" id="mode-help"></p>
          <select id="node-choice" aria-label="节点" hidden></select>
        </div>
        <label>当前账号 <b id="name"></b> 的代理（<span id="deflbl">留空 = 默认 127.0.0.1:7890</span>，direct = 直连）</label>
        <input id="proxy" placeholder="127.0.0.1:7890、socks5://127.0.0.1:7892、direct 或 vless://…" autocomplete="off" spellcheck="false">
        <input id="pip" placeholder="ProxyIP（可选，仅 VLESS 节点）例 1.2.3.4:443" autocomplete="off" spellcheck="false" style="margin-top:8px" hidden>
        <div class="row">
          <button class="pri" id="save">应用更改</button>
          <button id="usenode" hidden>用 VLESS 节点</button>
          <button id="browse" type="button">离线查阅</button>
        </div>
      </div>
    </div>

    <div class="off-foot-extra" id="others" hidden>
      <span style="font-size:11.5px;color:var(--fg3)">切换账号</span>
      <div class="accts" id="accts"></div>
    </div>

    <div class="off-foot-extra" id="authlock" hidden>
      <span style="font-size:12px;color:var(--fg2)">账号正在认证，线路已临时锁定</span>
      <button id="cancel-auth" type="button">取消认证并解锁</button>
    </div>
  </div>
  <small id="why"></small>
</div>
<script src="vless.js"></script>
<script src="route-state.js"></script>
<script src="route-policy.js"></script>
<script src="route-host.js"></script>
<script src="offline-context.js"></script>
<script src="nodes.js"></script>
<script src="iprep.js"></script>
<script src="pool.js"></script>
<script src="node-speed.js"></script>
<script src="node-routes.js"></script>
<script src="offline-modes.js"></script>
<script>
(function () {
  var H = window.BranaHost, A = window.BranaAndroid;
  function call(fn, arg) {
    if (H && typeof H[fn] === 'function') return H[fn](arg);
    if (A && typeof A[fn] === 'function') { try { var r = arg === undefined ? A[fn]() : A[fn](typeof arg === 'string' ? arg : JSON.stringify(arg)); return Promise.resolve(r ? JSON.parse(r) : null); } catch (e) { return Promise.reject(e); } }
    return Promise.reject(new Error('没有宿主接口'));
  }
  var q = new URLSearchParams(location.search), $ = function (id) { return document.getElementById(id); };
  if (q.get('desc') === '修改代理') { document.querySelector('h1').textContent = '连接设置'; document.title = '修改代理'; $('err').style.display = 'none'; }
  $('err').textContent = [q.get('desc') || '连接中断', q.get('code') ? '(' + q.get('code') + ')' : ''].filter(Boolean).join(' ');
  if (q.get('desc') !== '修改代理') {
    var targetName = '网站';
    try { targetName = new URL(q.get('url') || 'https://arena.ai').hostname; } catch {}
    document.title = document.querySelector('h1').textContent = '无法连接 ' + targetName;
  }
  if (q.get('browser') === '1') {
    document.title = document.querySelector('h1').textContent = '切换节点';
  }

  var acct = null, nativeModes = null;
  function hint(t, cls) {
    var e = $('hint'), bar = $('auto-bar'), dot = $('status-dot');
    if (e) { e.textContent = t || ''; e.className = 'hint ' + (cls || ''); }
    if (bar) bar.hidden = !t;
    if (dot) dot.className = 'off-dot' + (cls === 'ok' ? ' ok' : cls === 'bad' ? ' bad' : '');
  }
  function isV(p) { return /^vless:\/\/[^@\s]+@\S+$/i.test(p); }
  var VL = typeof Vless !== 'undefined' ? Vless : null, G = null;
  function valid(p) { return !p || /^(direct|直连)$/i.test(p) || (isV(p) && (!A || (VL && VL.parse(p)))) || /^((https?|socks5?h?|socks4):\/\/)?([^\s@\/]+@)?[\w.-]+:\d{1,5}\/?$/i.test(p); }
  function lbl(p) { return !p ? (G ? 'VLESS · ' + G.name : '默认代理') : /^(direct|直连)$/i.test(p) ? '直连' : isV(p) ? '节点' : p.replace(/\/\/[^@\/]*@/, '//***@'); }
  function syncPip() { $('pip').hidden = !isV($('proxy').value.trim()) || (!!A && !VL); }

  var route = RouteHost.create(H, A, VL);

  function gnodeInit() {
    if (!A || !A.sharedGet) return null;
    function sg(k) { try { var r = A.sharedGet(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
    var cur = sg('gnode'), g = null;
    try {
      var pool = sg('pippool'), nodes = sg('nodes') || [], id = pool && pool.node, n = null;
      for (var i = 0; i < nodes.length; i++) if (nodes[i] && nodes[i].id === id) n = nodes[i];
      if (n && VL) g = { link: VL.toLink(n), xout: JSON.stringify(VL.outbound(n, '')), name: n.name || n.address || 'VLESS 节点' };
    } catch (e) {}
    if (g && JSON.stringify(g) !== JSON.stringify(cur)) { try { A.sharedSet('gnode', JSON.stringify(g)); } catch (e) {} return { g: g, pushed: true }; }
    return cur && cur.link ? { g: cur, pushed: false } : null;
  }
  var gi = gnodeInit(); G = gi && gi.g;
  if (G) {
    $('deflbl').textContent = '留空 = VLESS 节点 ' + G.name;
    $('usenode').hidden = false;
  }
  $('proxy').addEventListener('input', syncPip);

  call('info').then(async function (info) {
    acct = info && info.account;
    if (!acct) return;
    $('name').textContent = acct.name;
    if ($('acct-badge') && (acct.name || acct.email)) {
      $('acct-badge').textContent = acct.name || acct.email;
      $('acct-badge').hidden = false;
    }
    if (acct.authLocked) {
      $('authlock').hidden = false;
      ['save', 'direct', 'usenode', 'proxy', 'pip'].forEach(function (id) { if ($(id)) $(id).disabled = true; });
      $('cancel-auth').onclick = async function () {
        if (!confirm('明确取消未完成认证？不会清除 Cookie 或自动重发请求。')) return;
        var taskCall = H && H.authTask ? function (r) { return H.authTask(r); } : function (r) { return RouteHost.rpc(window.BranaRoute, 'authTask', r); };
        try {
          var task = await taskCall({ op: 'status' });
          if (!task.ok) throw Error(task.error || '状态未确认');
          var result = await taskCall({ op: 'cancel', ticket: task.ticket });
          if (!result.ok) throw Error(result.error || '取消未确认');
          acct.authLocked = false;
          if (nativeModes) void nativeModes.refresh();
          hint('认证已取消，可自由切换线路', 'ok');
          $('authlock').hidden = true;
          ['save', 'direct', 'usenode', 'proxy', 'pip'].forEach(function (id) { if ($(id)) $(id).disabled = false; });
        } catch (e) { hint(String(e.message || e), 'bad'); }
      };
    }
    $('proxy').value = acct.proxy || '';
    $('pip').value = acct.proxyIp || '';
    syncPip();
    if (H && route && typeof OfflineModes !== 'undefined') {
      nativeModes = await OfflineModes.bind({ route: route, account: function () { return acct; }, hint: hint, retry: function () { call('back'); } });
    }
    if (G && !acct.proxy) {
      $('proxy').placeholder = '留空 = VLESS 节点 ' + G.name;
      if (gi.pushed) hint('已切换至节点 ' + G.name + '，正在重连…', 'ok');
    }
    return call('listAccounts').then(function (list) {
      var others = (list || []).filter(function (a) { return a.id !== acct.id; });
      if (!others.length) return;
      $('others').hidden = false;
      others.forEach(function (a) {
        var b = document.createElement('button');
        b.textContent = a.name + ' · ' + lbl(a.proxy);
        b.onclick = function () { call('openAccount', a.id); };
        $('accts').appendChild(b);
      });
    });
  }).catch(function (e) { hint('读取账号失败：' + e.message, 'bad'); });

  function save(p, pipOverride, nodeIdOverride, regOverride) {
    if (!acct) return Promise.resolve();
    if (!valid(p)) { hint(isV(p) ? 'VLESS 节点链接不正确' : '代理格式不正确，例：127.0.0.1:7890 或 direct', 'bad'); return Promise.resolve(); }
    hint('正在保存并重连…');
    var o = {
      id: acct.id,
      name: acct.name,
      proxy: p,
      proxyIp: pipOverride !== undefined ? pipOverride : (isV(p) ? $('pip').value.trim() : ''),
      nodeId: nodeIdOverride !== undefined ? nodeIdOverride : (acct.nodeId || ''),
      region: regOverride !== undefined ? regOverride : (acct.region || '')
    };
    if (A && isV(p)) { try { o.xout = JSON.stringify(VL.outbound(VL.parse(p), o.proxyIp)); } catch (e) { hint('节点链接不正确：' + e.message, 'bad'); return Promise.resolve(); } }
    return call('saveAccount', o).then(function () {
      try { if (typeof LastGoodRoute !== 'undefined') LastGoodRoute.save(o); } catch (e) {}
      hint('✓ 已保存，正在重新连接…', 'ok');
      setTimeout(function () { call('back'); }, 250);
    }).catch(function (e) { hint('保存失败：' + (e.message || e), 'bad'); });
  }

  if ($('act-browse-top')) $('act-browse-top').onclick = function () { call('back', 'browse'); };

  if ($('save')) $('save').onclick = function () { if (nativeModes) { nativeModes.apply(); return; } save($('proxy').value.trim()); };
  if ($('usenode')) $('usenode').onclick = function () { $('proxy').value = ''; syncPip(); save(''); };
  if ($('browse')) $('browse').onclick = function () { call('back', 'browse'); };

  // Emergency auto-recovery: unrestricted across all nodes & regions for pure non-429 IPs, then local 7890 fallback.
  var recoverFn = null;
  if (route && q.get('recovery') !== 'manual' && q.get('desc') !== '修改代理' && q.get('browser') !== '1') {
    var cancelled = true, rt = null;
    var engine = new RoutePolicy.Engine(Object.assign({}, route, {
      allowCrossRegionEscape: true,
      cancelled:function () { return cancelled; },
      progress:function (t) { hint('⚡ 自动恢复中：' + t); }
    }));
    function cancelRoute() { cancelled = true; clearTimeout(rt); }
    document.addEventListener('input', cancelRoute, true);
    window.addEventListener('pagehide', cancelRoute);
    document.addEventListener('pointerdown', function (e) {
      if (e.target && e.target.closest && e.target.closest('button,input,select,textarea')) cancelRoute();
    }, true);
    recoverFn = function (force) {
      cancelled = false;
      clearTimeout(rt);
      engine.run('network', !!force).then(function (r) {
        if (cancelled) return;
        if (r.ok) { hint('✓ 已自动连上可用纯净线路，正在返回…', 'ok'); call('back'); return; }
        hint(r.error || '自动重连未成功，请选择节点点「应用更改」或点右上角 × 离线查阅', 'bad');
        if (!r.disabled && !r.stale && !r.blocked) rt = setTimeout(function () { recoverFn(false); }, Math.max(12000, engine.next - Date.now()));
      }).catch(function () { if (!cancelled) rt = setTimeout(function () { recoverFn(false); }, 20000); });
    };
    if (q.get('auto') === '1') recoverFn(false);
    else hint('');
  } else {
    hint('');
  }

  $('proxy').addEventListener('keydown', function (e) { if (e.key === 'Enter' && $('save')) $('save').click(); });
})();
</script>
</body>
</html>
