plugins {
    id 'com.android.application'
}

def pkg = new groovy.json.JsonSlurper().parseText(file('../../package.json').getText('UTF-8'))
def vParts = pkg.version.tokenize('-')[0].tokenize('.').collect { it as int }
def vCode = vParts[0] * 1000000 + vParts[1] * 10000 + vParts[2]

android {
    namespace 'ai.arena.client'
    compileSdk 35

    defaultConfig {
        applicationId "ai.arena.client"
        minSdk 26
        targetSdk 35
        versionCode vCode
        versionName pkg.version
        resConfigs "zh", "zh-rCN", "en"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            def ks = file('release.keystore')
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('KS_PASS') ?: 'arena123'
                keyAlias System.getenv('KEY_ALIAS') ?: 'arena'
                keyPassword System.getenv('KEY_PASS') ?: 'arena123'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ks = file('release.keystore')
            signingConfig ks.exists() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                'META-INF/*.kotlin_module',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/*.version',
                'DebugProbesKt.bin',
                'kotlin-tooling-metadata.json'
            ]
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.webkit:webkit:1.12.1'
}
