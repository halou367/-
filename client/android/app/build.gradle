plugins {
    id 'com.android.application'
}

def pkg = new groovy.json.JsonSlurper().parseText(file('../../package.json').getText('UTF-8'))
def vParts = pkg.version.tokenize('-')[0].tokenize('.').collect { it as int }
def vCode = vParts[0] * 1000000 + vParts[1] * 10000 + vParts[2]

android {
    namespace 'ai.arena.client'
    compileSdk 35

    defaultConfig {
        applicationId "ai.arena.client"
        minSdk 26
        targetSdk 35
        versionCode vCode
        versionName pkg.version
        resConfigs "zh", "zh-rCN", "en"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            // 可用环境变量覆盖，否则使用仓库内置永久签名 release.jks（CN=Arena Client），严禁回退随机 debug 证书
            def envKs = System.getenv('ANDROID_KEYSTORE_FILE')
            def ks = envKs ? file(envKs) : (file('release.jks').exists() ? file('release.jks') : file('release.keystore'))
            if (!ks.exists()) {
                throw new GradleException("Release keystore missing: " + ks)
            }
            storeFile ks
            storeType 'pkcs12'
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: System.getenv('KS_PASS') ?: 'arenaclient'
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: System.getenv('KEY_ALIAS') ?: 'arena'
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('KEY_PASS') ?: 'arenaclient'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                'META-INF/*.kotlin_module',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/*.version',
                'DebugProbesKt.bin',
                'kotlin-tooling-metadata.json'
            ]
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.webkit:webkit:1.12.1'
}
